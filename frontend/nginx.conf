server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - rute client-side (/articles/123/edit) nu exista ca fisiere
    location / { try_files $uri $uri/ /index.html }

    # Cache lung pentru assets cu hash (Angular --output-hashing=all)
    location ~* \.(js|css|woff|woff2|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
