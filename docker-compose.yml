services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness-tracker-db
    environment:
      POSTGRES_DB: fitness_tracker
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness123
    ports:
      - "5433:5432"
    volumes:
      - fitness_tracker_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  fitness_tracker_data:
